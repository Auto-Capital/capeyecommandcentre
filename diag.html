<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CapEye Diagnostic</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:620px;margin:0 auto;padding:20px;background:#0a1a4d;color:#fff}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#9fb3d9;font-size:13px;margin-bottom:18px}
.row{background:#12235c;border:1px solid #27407f;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.row .t{font-weight:700;font-size:14px;margin-bottom:4px}
.row .d{font-size:13px;color:#cdd9f0;word-break:break-word}
.ok{color:#4ade80;font-weight:800}
.bad{color:#f87171;font-weight:800}
.pending{color:#fbbf24;font-weight:800}
button{background:#C8102E;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:800;width:100%;margin-top:10px;cursor:pointer}
.big{font-size:17px;text-align:center;padding:16px;border-radius:12px;margin:14px 0;font-weight:800}
</style></head>
<body>
<h1>CapEye Connection Diagnostic</h1>
<div class="sub">This checks whether the app can reach the database. Share a screenshot of this page.</div>

<div id="verdict" class="big" style="background:#12235c">Running checks…</div>

<div class="row"><div class="t">1. Page version</div><div class="d" id="r-ver">—</div></div>
<div class="row"><div class="t">2. Firebase library loaded</div><div class="d" id="r-lib">—</div></div>
<div class="row"><div class="t">3. Firestore connect</div><div class="d" id="r-fs">—</div></div>
<div class="row"><div class="t">4. READ staff_jobs</div><div class="d" id="r-read">—</div></div>
<div class="row"><div class="t">5. WRITE test</div><div class="d" id="r-write">—</div></div>
<div class="row"><div class="t">6. Jobs currently in database</div><div class="d" id="r-count">—</div></div>

<button onclick="location.reload()">Run again</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=diag1"></script>
<script>
var VERSION = 'DIAG-2026-11-03';
function set(id, html){ document.getElementById(id).innerHTML = html; }
function ok(s){ return '<span class="ok">✓ '+s+'</span>'; }
function bad(s){ return '<span class="bad">✗ '+s+'</span>'; }

set('r-ver', ok('Loaded this diagnostic ('+VERSION+'). If you can read this, the file is fresh.'));

var FS=null;
try {
  if (typeof firebase === 'undefined') { set('r-lib', bad('Firebase library did NOT load — no internet, or scripts blocked.')); finalize(); }
  else if (typeof FIREBASE_CONFIG === 'undefined') { set('r-lib', bad('firebase-config.js did NOT load — wrong folder / not uploaded.')); finalize(); }
  else {
    firebase.initializeApp(FIREBASE_CONFIG);
    FS = firebase.firestore();
    set('r-lib', ok('Firebase + config loaded. Project: '+FIREBASE_CONFIG.projectId));
    runFirestore();
  }
} catch(e){ set('r-lib', bad('Error: '+(e&&e.message))); finalize(); }

function runFirestore(){
  set('r-fs', ok('Firestore object created.'));
  // READ
  FS.collection('staff_jobs').limit(5).get()
    .then(function(snap){
      set('r-read', ok('READ worked — database is reachable and rules allow reading.'));
      set('r-count', ok(snap.size + ' job(s) read back (showing up to 5). Total may be higher.'));
      testWrite();
    })
    .catch(function(e){
      var c = e && e.code;
      if (c === 'permission-denied') set('r-read', bad('READ blocked: permission-denied. → The Firestore RULES are still locked. Publish the open rules.'));
      else set('r-read', bad('READ failed: '+(c||e.message)+' → likely no internet / wrong project.'));
      set('r-count','—');
      testWrite();
    });
}

function testWrite(){
  if(!FS){ finalize(); return; }
  var id = 'diag_'+Date.now();
  FS.collection('staff_jobs').doc(id).set({ _diag:true, note:'diagnostic test', createdAt:Date.now() })
    .then(function(){
      set('r-write', ok('WRITE worked — app can save jobs. Cleaning up test record…'));
      FS.collection('staff_jobs').doc(id).delete().catch(function(){});
      finalize();
    })
    .catch(function(e){
      var c = e && e.code;
      if (c === 'permission-denied') set('r-write', bad('WRITE blocked: permission-denied. → Rules still locked for writing. Publish the open rules.'));
      else set('r-write', bad('WRITE failed: '+(c||e.message)));
      finalize();
    });
}

function finalize(){
  setTimeout(function(){
    var read = document.getElementById('r-read').textContent;
    var write = document.getElementById('r-write').textContent;
    var v = document.getElementById('verdict');
    if (read.indexOf('✓')===0 && write.indexOf('✓')===0){
      v.style.background='#14532d'; v.innerHTML='✓ ALL GOOD — the app CAN sync. If the app still shows "not connected", it is running old cached code — reinstall from a fresh link.';
    } else if (read.indexOf('permission-denied')>-1 || write.indexOf('permission-denied')>-1){
      v.style.background='#7f1d1d'; v.innerHTML='✗ RULES LOCKED — the database is refusing access. The open Firestore rules have NOT taken effect yet. Re-publish them in Firebase.';
    } else {
      v.style.background='#7f1d1d'; v.innerHTML='✗ CANNOT REACH DATABASE — check the detail lines above and send a screenshot.';
    }
  }, 300);
}
</script>
</body></html>
