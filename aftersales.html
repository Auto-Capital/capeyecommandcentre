})();

<script>

document.getElementById('nav-user').textContent = getCurrentUser().name;

const DEMO_ISSUES = [
  {reg:'GH22RST',make:'PEUGEOT',model:'EXPERT',issue:'Customer reports clutch slipping after 2 weeks',reportedBy:'Germaine Dua',tech:'David',status:'Open',priority:'Urgent',date:'12/03/2026'},
  {reg:'GH22RST',make:'PEUGEOT',model:'EXPERT',issue:'Warning light appeared — DPF',reportedBy:'Customer',tech:'Marcin Kiljan',status:'In Progress',priority:'Normal',date:'15/03/2026'},
];

function refreshAfKpis() {
  var faults = loadFaultsData();
  var kpis=[
    {v:faults.length,l:'Total Issues',c:'#ef4444'},
    {v:faults.filter(function(i){return i.status==='Open';}).length,l:'Open',c:'#C8102E'},
    {v:faults.filter(function(i){return i.status==='In Progress';}).length,l:'In Progress',c:'#f59e0b'},
    {v:faults.filter(function(i){return i.status==='Resolved'||i.status==='Closed';}).length,l:'Resolved',c:'#10b981'}
  ];
  document.getElementById('af-kpis').innerHTML=kpis.map(function(k){return '<div style="background:#fff;border-radius:10px;padding:12px 16px;border:1px solid var(--border);border-top:3px solid '+k.c+'"><div style="font-family:\'IBM Plex Mono\',monospace;font-size:22px;font-weight:700;color:'+k.c+'">'+k.v+'</div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);margin-top:3px">'+k.l+'</div></div>';}).join('');
}
refreshAfKpis();

// Faults render to af-list via renderFaultsList(), driven live by
// Firestore (afAttachLive). We deliberately do NOT seed demo issues into
// the shared collection any more — real logged faults are the source of
// truth and seeding would show phantom faults to every user.
renderFaultsList();

function openLogFault() {
  // af-reg is a free-text input (type any reg) — nothing to populate there.
  var regEl = document.getElementById('af-reg');
  if (regEl) regEl.value = '';
  // Populate technician dropdown if present (guard AC_STAFF).
  var techSel = document.getElementById('af-tech');
  if (techSel && typeof AC_STAFF !== 'undefined') {
    techSel.innerHTML = '<option value="">Select technician...</option>';
    AC_STAFF.filter(function(s){ return s.dept==='Workshop'; }).forEach(function(s){
      var o=document.createElement('option'); o.value=s.name; o.textContent=s.name; techSel.appendChild(o);
    });
  }
  document.getElementById('fault-modal').classList.add('open');
}

const AF_KEY = 'ce_aftersales_faults';
function loadFaultsData() { try { return JSON.parse(localStorage.getItem(AF_KEY)||'[]'); } catch(e) { return []; } }

// Local cache write only — Firestore writes happen per-fault via helpers
// below so each fault keeps a STABLE id (not an array index that shifts
// every time a new fault is unshifted to the front of the list).
function saveFaultsData(d) {
  try { localStorage.setItem(AF_KEY, JSON.stringify(d)); } catch(e) {}
}

// Give every fault a stable unique id the first time we see it.
function _afEnsureId(f) {
  if (!f.id) f.id = 'af_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  return f.id;
}

// Write ONE fault to Firestore under its stable id.
function afWriteFault(f) {
  _afEnsureId(f);
  if (typeof FS !== 'undefined' && FS) {
    FS.collection('aftersales').doc(f.id).set(f).catch(function(e){
      console.warn('[CapEye] aftersales write failed', e);
    });
  }
}

// Delete ONE fault from Firestore by id.
function afDeleteFaultRemote(id) {
  if (id && typeof FS !== 'undefined' && FS) {
    FS.collection('aftersales').doc(id).delete().catch(function(){});
  }
}

// Live listener: keeps every logged-in user's screen in sync. Whenever
// anyone logs, updates, or deletes a fault, all sessions re-render.
function afAttachLive() {
  if (typeof FS === 'undefined' || !FS) return;
  FS.collection('aftersales').onSnapshot(function(snap) {
    var faults = [];
    snap.forEach(function(doc){ faults.push(Object.assign({ id: doc.id }, doc.data())); });
    // Newest first, by loggedAt
    faults.sort(function(a,b){ return (b.loggedAt||'').localeCompare(a.loggedAt||''); });
    saveFaultsData(faults);
    renderFaultsList();
    refreshAfKpis();
  }, function(err){ console.warn('[CapEye] aftersales listener error', err); });
}
function renderFaultsList() {
  var container = document.getElementById('af-list');
  if (!container) return;
  var faults = loadFaultsData();
  var cols = {'Open':'#C8102E','In Progress':'#d4980a','Resolved':'#10b981','Closed':'#6B7280'};
  if (!faults.length) { container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--ink3)">No faults logged yet</div>'; return; }
  container.innerHTML = faults.map(function(f,i) {
    var col = cols[f.status]||'#6B7280';
    return '<div style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;border-left:4px solid '+col+'">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'+
      '<div><span style="font-family:IBM Plex Mono,monospace;font-size:12px;font-weight:700;background:#f5c518;color:#000;padding:1px 7px;border-radius:3px;margin-right:8px">'+f.reg+'</span>'+
      '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:'+col+'20;color:'+col+'">'+f.status+'</span></div>'+
      '<div style="display:flex;gap:6px">'+
      '<select onchange="updateFaultStat('+i+',this.value)" style="font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:5px">'+
      ['Open','In Progress','Resolved','Closed'].map(function(s){ return '<option'+(f.status===s?' selected':'')+'>'+s+'</option>'; }).join('')+
      '</select>'+
      '<button onclick="deleteFaultEntry('+i+')" style="border:1px solid #fecaca;border-radius:5px;background:#fff;color:#C8102E;padding:3px 8px;font-size:11px;cursor:pointer">✕</button></div></div>'+
      '<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+f.issue+'</div>'+
      '<div style="font-size:10px;color:var(--ink3)">'+f.loggedBy+' · '+new Date(f.loggedAt).toLocaleDateString('en-GB')+'</div></div>';
  }).join('');
}
function updateFaultStat(idx,status) {
  var f=loadFaultsData();
  if(!f[idx]) return;
  f[idx].status=status;
  saveFaultsData(f);
  afWriteFault(f[idx]);   // sync status change to all users
  renderFaultsList(); refreshAfKpis();
}
function deleteFaultEntry(idx) {
  if(!confirm('Delete?')) return;
  var f=loadFaultsData();
  var removed = f[idx];
  f.splice(idx,1);
  saveFaultsData(f);
  if (removed && removed.id) afDeleteFaultRemote(removed.id);   // remove for all users
  renderFaultsList(); refreshAfKpis();
  showToast('Deleted','success');
}
function logFault() {
  var reg = (document.getElementById('af-reg').value||'').trim().toUpperCase();
  var issue = (document.getElementById('af-issue').value||'').trim();
  if (!reg || !issue) { showToast('Please fill in registration and issue','error'); return; }
  var fault = { reg:reg, issue:issue, status:'Open', loggedAt:new Date().toISOString(), loggedBy:getCurrentUser?getCurrentUser().name:'Unknown' };
  _afEnsureId(fault);
  var faults = loadFaultsData(); faults.unshift(fault); saveFaultsData(faults);
  afWriteFault(fault);   // push to Firestore so all users see it live
  showToast('Fault logged for '+reg,'success');
  document.getElementById('fault-modal').classList.remove('open');
  renderFaultsList();
  refreshAfKpis();
}

document.addEventListener("DOMContentLoaded", function() {
  // Go live: sync faults across all logged-in users in real time.
  afAttachLive();
});

</script>

<!-- NOTIFICATION PANEL -->
<div class="notif-overlay" id="notifOverlay" onclick="closeNotifPanel()"></div>
<div class="notif-panel" id="notifPanel">
  <div class="notif-hdr">
    <span class="notif-title"><i class="fas fa-bell"></i> Notifications</span>
    <button onclick="markAllRead();renderNotifPanel()" style="background:none;border:none;font-size:11px;color:var(--ink3);cursor:pointer;font-family:inherit;font-weight:600">Mark all read</button>
    <button onclick="closeNotifPanel()" style="background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink3);padding:2px 6px">&times;</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>
<script>
// ── NAV BELL ──────────────────────────────────────────────────────
function updateBell() {
  var count = getUnreadCount();
  var badge = document.getElementById('bellBadge');
  if (!badge) return;
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 9 ? '9+' : count;
  } else {
    badge.style.display = 'none';
  }
}

function openNotifPanel() {
  document.getElementById('notifPanel').classList.add('open');
  document.getElementById('notifOverlay').classList.add('open');
  renderNotifPanel();
  markAllRead();
  setTimeout(updateBell, 300);
}

function closeNotifPanel() {
  document.getElementById('notifPanel').classList.remove('open');
  document.getElementById('notifOverlay').classList.remove('open');
}

function renderNotifPanel() {
  var notifs = getMyNotifications();
  var list = document.getElementById('notifList');
  if (!notifs.length) {
    list.innerHTML = '<div class="notif-empty"><i class="fas fa-bell-slash"></i>No notifications yet</div>';
    return;
  }
  list.innerHTML = notifs.slice(0, 30).map(function(n) {
    var ago = timeAgo(n.ts);
    var typeLabel = { handover:'Handover', urgent:'Urgent', skip:'Skipped', sendback:'Sent Back', fault:'Fault' }[n.type] || n.type;
    return '<div class="notif-item' + (n.read ? '' : ' unread') + '" onclick="window.location.href=\'' + (n.link||'workflow.html') + '\'">' +
      '<div class="notif-item-hdr">' +
      '<span class="notif-reg">' + n.reg + '</span>' +
      '<span class="notif-type ' + n.type + '">' + typeLabel + '</span>' +
      '</div>' +
      '<div class="notif-body">' + n.vehicle + ' — ' + n.stage + (n.fromName ? ' · from ' + n.fromName : '') + '</div>' +
      (n.note ? '<div class="notif-meta">"' + n.note.slice(0,60) + (n.note.length>60?'…':'') + '"</div>' : '') +
      '<div class="notif-meta">' + ago + '</div>' +
      '</div>';
  }).join('');
}

function timeAgo(ts) {
  var diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'hr ago';
  return Math.floor(diff/86400) + 'd ago';
}

// Poll for new notifications every 60s
setInterval(updateBell, 60000);
document.addEventListener('DOMContentLoaded', function() { setTimeout(updateBell, 1000); });
</script>
